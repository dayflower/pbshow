name: Verify (Reusable)

on:
  workflow_call:

jobs:
  verify:
    runs-on: macos-15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Swift 6.2
        uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a # v2.4.0
        with:
          swift-version: "6.2"

      - name: Install swift-format
        run: brew install swift-format

      - name: Run lint
        run: make lint

      - name: Run tests
        run: make test

      - name: Initialize CodeQL
        uses: github/codeql-action/init@411bbbe57033eedfc1a82d68c01345aa96c737d7 # v4
        with:
          languages: swift
          build-mode: manual
          config: |
            threat-models: remote

      - name: Build for CodeQL
        run: swift build --arch arm64

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@411bbbe57033eedfc1a82d68c01345aa96c737d7 # v4
